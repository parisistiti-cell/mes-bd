<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ardèche 2026</title>
<meta name="description" content="Ardèche 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #3d7d94;
    --teal-deep: #2b5c6e;
    --cream: #f2e9d3;
    --wood: #c79a63;
    --rust: #c0503a;
    --rust-deep: #9c3d2c;
    --ink: #2a2521;
    --ink-soft: #5c534a;
    --rule: rgba(42, 37, 33, 0.15);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(242, 233, 211, 0.94);
    backdrop-filter: blur(6px);
    border-bottom: 2px solid var(--ink);
  }

  .topbar__title {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.01em;
    color: var(--rust-deep);
    text-decoration: none;
  }

  .topbar__home {
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-soft);
  }

  .topbar__progress {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .hero {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero__caption {
    max-width: 560px;
    margin: 36px auto 56px;
    padding: 0 28px;
    text-align: center;
  }

  .hero__caption h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(1.6rem, 5.5vw, 2.2rem);
    letter-spacing: 0.01em;
    margin: 0 0 14px;
    color: var(--rust-deep);
    line-height: 1.15;
  }

  .hero__caption p {
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 22px;
  }

  .pdf-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    color: var(--rust-deep);
    background: transparent;
    border: 2px solid var(--rust-deep);
    border-radius: 4px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .pdf-btn:hover:not(:disabled) {
    background: var(--rust-deep);
    color: var(--cream);
  }

  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .reader {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 100px;
  }

  .page {
    display: block;
    width: 100%;
    margin: 0 auto;
  }

  .page img {
    display: block;
    width: 100%;
    height: auto;
  }

  .placeholder {
    margin: 20px auto;
    padding: 48px 28px;
    max-width: 560px;
    text-align: center;
    border: 2px dashed var(--ink);
    border-radius: 4px;
    color: var(--ink-soft);
    background: rgba(61, 125, 148, 0.06);
  }

  .placeholder p {
    margin: 0 0 6px;
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .placeholder code {
    background: var(--wood);
    color: var(--ink);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.85rem;
  }

  footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: var(--ink-soft);
    font-size: 0.8rem;
    border-top: 2px solid var(--ink);
  }

  footer a { color: var(--rust-deep); }
</style>
</head>
<body>

  <nav class="topbar">
    <a class="topbar__title" href="#top">Ardèche 2026</a>
    <a class="topbar__home" href="../">Toutes les BD</a>
  </nav>

  <div id="top"></div>

  <header class="hero">
    <img src="images/00.jpg" alt="Couverture — Ardèche 2026">
  </header>

  <div class="hero__caption">
    <h1>Ardèche 2026</h1>
   
    <button id="pdf-btn" class="pdf-btn" onclick="downloadPDF()">Télécharger en PDF</button>
  </div>

  <!--
    ===========================================================
    AJOUTE TES PLANCHES ICI

    Pour chaque planche : dépose l'image dans le dossier images/
    puis ajoute un bloc comme celui-ci (en gardant le même ordre
    que ton histoire) :

   
    ===========================================================
  -->
  <main class="reader">
    
    <div class="page">
      <img src="images/01.jpg" alt="Planche 1">
    </div>
    
    <div class="page">
      <img src="images/02.jpg" alt="Planche 2">
    </div>
  </main>

  <footer>
   Ardèche 2026 — mis à jour au fil des chapitres
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // Génère un PDF à partir de la couverture et de toutes les planches
    // actuellement présentes sur la page, dans leur ordre d'affichage.
    async function downloadPDF() {
      const btn = document.getElementById('pdf-btn');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Préparation du PDF...';

      try {
        const { jsPDF } = window.jspdf;
        const images = Array.from(document.querySelectorAll('.hero img, .page img'));
        let doc;

        for (let i = 0; i < images.length; i++) {
          const img = images[i];
          if (!img.complete) {
            await new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
          }
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

          const wmm = canvas.width * 0.264583;
          const hmm = canvas.height * 0.264583;
          const orientation = wmm > hmm ? 'landscape' : 'portrait';

          if (i === 0) {
            doc = new jsPDF({ orientation, unit: 'mm', format: [wmm, hmm] });
          } else {
            doc.addPage([wmm, hmm], orientation);
          }
          doc.addImage(dataUrl, 'JPEG', 0, 0, wmm, hmm);
        }

        doc.save("Ardèche 2026.pdf");
      } catch (err) {
        alert("Le PDF n'a pas pu être généré. Réessaie, ou vérifie que toutes les planches sont bien chargées.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }
  </script>

</body>
</html>
