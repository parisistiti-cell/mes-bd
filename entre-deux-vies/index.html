<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre deux vies</title>
<meta name="description" content="Entre deux vies — une rencontre au-delà du temps et des conventions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f2ead9;
    --cream-deep: #e8dcc3;
    --ink: #3a2e28;
    --ink-soft: #6b5c50;
    --terracotta: #b9645f;
    --terracotta-deep: #9c4a47;
    --rule: rgba(58, 46, 40, 0.15);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(242, 234, 217, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule);
  }

  .topbar__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--terracotta-deep);
    text-decoration: none;
  }

  .topbar__progress {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .hero {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero__caption {
    max-width: 560px;
    margin: 40px auto 60px;
    padding: 0 28px;
    text-align: center;
  }

  .hero__caption h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 2.6rem);
    letter-spacing: 0.01em;
    margin: 0 0 12px;
    color: var(--terracotta-deep);
  }

  .hero__caption p {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 22px;
  }

  .pdf-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.85rem;
    color: var(--terracotta-deep);
    background: transparent;
    border: 1px solid var(--terracotta-deep);
    border-radius: 20px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .pdf-btn:hover:not(:disabled) {
    background: var(--terracotta-deep);
    color: var(--cream);
  }

  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .reader {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 100px;
  }

  .page {
    display: block;
    width: 100%;
    margin: 0 auto;
    scroll-margin-top: 64px;
  }

  .page img {
    display: block;
    width: 100%;
    height: auto;
  }

  .placeholder {
    margin: 20px auto;
    padding: 48px 28px;
    max-width: 560px;
    text-align: center;
    border: 1px dashed var(--rule);
    border-radius: 4px;
    color: var(--ink-soft);
  }

  .placeholder p {
    margin: 0 0 6px;
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .placeholder code {
    background: var(--cream-deep);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.85rem;
  }

  footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: var(--ink-soft);
    font-size: 0.8rem;
    border-top: 1px solid var(--rule);
  }

  footer a { color: var(--terracotta-deep); }
</style>
</head>
<body>

  <nav class="topbar">
    <a class="topbar__title" href="#top">Entre deux vies</a>
    <a class="topbar__home" href="../" style="font-size:0.8rem;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--ink-soft);">Toutes les BD</a>
  </nav>

  <div id="top"></div>

  <header class="hero">
    <img src="images/00-couverture.jpg" alt="Couverture — Entre deux vies">
  </header>

  <div class="hero__caption">
    <h1>Entre deux vies</h1>
    <p>Une rencontre au-delà du temps et des conventions.</p>
    <button id="pdf-btn" class="pdf-btn" onclick="downloadPDF()">Télécharger en PDF</button>
  </div>

  <!--
    ===========================================================
    AJOUTE TES PLANCHES ICI

    Pour chaque planche : dépose l'image dans le dossier images/
    puis ajoute un bloc comme celui-ci (en gardant le même ordre
    que ton histoire). N'oublie pas l'attribut id (ex: id="page-51")
    pour que les liens directs vers cette planche fonctionnent :

    <div class="page" id="page-51">
      <img src="images/51.jpg" alt="Planche 51">
    </div>
    ===========================================================
  -->

  </main>

  <footer>
    Entre deux vies — mis à jour au fil des chapitres
  </footer>

  <script>
    const progressEl = document.getElementById('progress');
    function updateProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? Math.round((scrollTop / docHeight) * 100) : 0;
      progressEl.textContent = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();
  </script>

  <script>
    // N'affiche qu'une seule planche (masque le reste et bloque le
    // défilement) quand on arrive via un lien direct #page-N.
    // Pour ce livre (protégé), c'est le middleware qui appelle cette
    // fonction une fois le code validé, via window.__isolatePage(...).
    function __isolatePage(target) {
      if (!target) return;
      const el = document.querySelector(target);
      if (!el) return;
      document.querySelectorAll('.page').forEach((p) => {
        if (p !== el) p.style.display = 'none';
      });
      const hero = document.querySelector('.hero');
      const caption = document.querySelector('.hero__caption');
      if (hero) hero.style.display = 'none';
      if (caption) caption.style.display = 'none';
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      el.scrollIntoView();
    }
    window.__isolatePage = __isolatePage;

    // Cas où la page serait consultée sans passer par le code (ne devrait
    // pas arriver pour un livre protégé, mais gardé par cohérence).
    if (window.location.hash) {
      document.addEventListener('DOMContentLoaded', () => __isolatePage(window.location.hash));
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    async function downloadPDF() {
      const btn = document.getElementById('pdf-btn');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Préparation du PDF...';

      try {
        const { jsPDF } = window.jspdf;
        const images = Array.from(document.querySelectorAll('.hero img, .page img'));
        let doc;

        for (let i = 0; i < images.length; i++) {
          const img = images[i];
          if (!img.complete) {
            await new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
          }
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

          const wmm = canvas.width * 0.264583;
          const hmm = canvas.height * 0.264583;
          const orientation = wmm > hmm ? 'landscape' : 'portrait';

          if (i === 0) {
            doc = new jsPDF({ orientation, unit: 'mm', format: [wmm, hmm] });
          } else {
            doc.addPage([wmm, hmm], orientation);
          }
          doc.addImage(dataUrl, 'JPEG', 0, 0, wmm, hmm);
        }

        doc.save('Entre deux vies.pdf');
      } catch (err) {
        alert("Le PDF n'a pas pu être généré. Réessaie, ou vérifie que toutes les planches sont bien chargées.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }
  </script>
