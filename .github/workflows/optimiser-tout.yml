name: Optimiser tout

on:
  workflow_dispatch:
    inputs:
      dossier:
        description: "Dossier à optimiser (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python optimiser_tout.py "${{ github.event.inputs.dossier }}"
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Images optimisées" || echo "Rien à changer"
          git push
