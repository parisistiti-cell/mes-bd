name: Optimiser les images

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python optimiser_images.py
        working-directory: lieux
      - run: rm -rf lieux/_originaux
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add lieux/images lieux/photos
          git commit -m "Images optimisées" || echo "Rien à changer"
          git push
