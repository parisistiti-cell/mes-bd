<style>
  :root {
    --cream: #f2ead9;
    --cream-deep: #e8dcc3;
    --ink: #3a2e28;
    --ink-soft: #6b5c50;
    --accent: #5a7d5e;
    --accent-deep: #45624a;
    --rule: rgba(58, 46, 40, 0.15);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(242, 234, 217, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--accent-deep);
    text-decoration: none;
  }
  .topbar__home {
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-soft);
  }
  .hero {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }
  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }
  .hero__caption {
    max-width: 560px;
    margin: 40px auto 60px;
    padding: 0 28px;
    text-align: center;
  }
  .hero__caption h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 2.6rem);
    letter-spacing: 0.01em;
    margin: 0 0 22px;
    color: var(--accent-deep);
  }
  .pdf-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.85rem;
    color: var(--accent-deep);
    background: transparent;
    border: 1px solid var(--accent-deep);
    border-radius: 20px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pdf-btn:hover:not(:disabled) {
    background: var(--accent-deep);
    color: var(--cream);
  }
  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .reader {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 100px;
  }
  .page {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 0 auto;
    scroll-margin-top: 64px;
    position: relative;
  }
  .zoom-hint {
    position: absolute;
    bottom: 14px;
    right: 14px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(30, 26, 22, 0.78);
    color: #f2ead9;
    font-family: 'Karla', sans-serif;
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) {
    .page:hover .zoom-hint {
      display: flex;
    }
  }

  .page img {
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: calc(100vh - 90px);
    max-height: calc(100dvh - 90px);
    margin: 0 auto;
    object-fit: contain;
    cursor: zoom-in;
    transition: transform 0.25s ease;
  }
  .page.zoomed {
    overflow: hidden;
    cursor: grab;
  }
  .page.zoomed.dragging {
    cursor: grabbing;
  }
  .page.zoomed.dragging img {
    transition: none;
  }

  footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: var(--ink-soft);
    font-size: 0.8rem;
    border-top: 1px solid var(--rule);
  }
  .pager-controls .pdf-btn {
    color: var(--cream);
    border-color: var(--cream);
    font-size: 0.75rem;
    padding: 6px 14px;
  }
  .pager-controls .pdf-btn:hover:not(:disabled) {
    background: var(--cream);
    color: var(--ink);
  }
  /* ---- Bouton + lecteur vidéo (planches couverture et 1 à 7) ---- */

    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;

  .video-modal__box { position: relative; width: min(960px, 100%); }
  .video-modal video {

  .video-modal__actions {

  .video-modal__actions button {
    font-family: 'Karla', sans-serif;
    font-size: 0.9rem;

    color: var(--cream);

    border: 2px solid var(--cream);

  .video-modal__actions button:hover:not(:disabled) { background: var(--cream); color: var(--ink); }
  .video-modal__actions button:disabled { opacity: 0.6; cursor: default; }
  .video-modal.ended .video-modal__actions .is-replay { background: var(--accent-deep); border-color: var(--accent-deep); }
  .video-modal__close {
    position: absolute;
    top: -42px;
    right: 0;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--cream);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
  }
</style>

  <script>
    function __isolatePage(target) {
      if (!target) return;
      const el = document.querySelector(target);
      if (!el) return;
      document.querySelectorAll('.page').forEach((p) => {
        p.style.display = (p === el) ? 'flex' : 'none';
      });
      const hero = document.querySelector('.hero');
      const caption = document.querySelector('.hero__caption');
      const foot = document.querySelector('footer');
      if (hero) hero.style.display = 'none';
      if (caption) caption.style.display = 'none';
      if (foot) foot.style.display = 'none';
      const pager = document.querySelector('.pager-controls');
      if (pager) pager.remove();
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      el.scrollIntoView();
    }
    window.__isolatePage = __isolatePage;

    if (window.location.hash) {
      document.addEventListener('DOMContentLoaded', () => __isolatePage(window.location.hash));
    } else {
      document.addEventListener('DOMContentLoaded', () => {
        const pages = Array.from(document.querySelectorAll('.reader .page'));
        if (pages.length === 0) return;

        let current = 0;

        const hero = document.querySelector('.hero');
        const caption = document.querySelector('.hero__caption');
        const foot = document.querySelector('footer');
        const pdfBtn = document.getElementById('pdf-btn');

        if (hero) hero.style.display = 'none';
        if (foot) foot.style.display = 'none';
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const style = document.createElement('style');
        style.textContent = `
          .pager-controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 14px; align-items: center; z-index: 30;
            background: rgba(30,26,22,0.82); backdrop-filter: blur(6px);
            padding: 8px 18px; border-radius: 30px; color: #f2ead9;
            font-family: -apple-system, sans-serif; font-size: 0.85rem;
          }
          .pager-btn {
            background: none; border: none; color: #f2ead9; font-size: 1.3rem;
            cursor: pointer; padding: 2px 10px; line-height: 1;
          }
          .pager-btn:disabled { opacity: 0.3; cursor: default; }
          .reader { padding-bottom: 0 !important; }
        `;
        document.head.appendChild(style);

        const controls = document.createElement('div');
        controls.className = 'pager-controls';

        const prevBtn = document.createElement('button');
        prevBtn.className = 'pager-btn';
        prevBtn.textContent = '‹';
        prevBtn.setAttribute('aria-label', 'Planche précédente');

        const counter = document.createElement('span');

        const nextBtn = document.createElement('button');
        nextBtn.className = 'pager-btn';
        nextBtn.textContent = '›';
        nextBtn.setAttribute('aria-label', 'Planche suivante');

        function show(i) {
          pages.forEach((p, idx) => {
            p.style.display = idx === i ? 'flex' : 'none';
            p.classList.remove('zoomed');
            const im = p.querySelector('img');
            if (im) im.style.transform = '';
            const hint = p.querySelector('.zoom-hint');
            if (hint) hint.textContent = '🔍 Cliquer pour zoomer';
          });
          prevBtn.disabled = i === 0;
          nextBtn.disabled = i === pages.length - 1;
          counter.textContent = (i + 1) + ' / ' + pages.length;
          if (window.__onShow) window.__onShow(i);
        }

        prevBtn.addEventListener('click', () => { if (current > 0) { current--; show(current); } });
        nextBtn.addEventListener('click', () => { if (current < pages.length - 1) { current++; show(current); } });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') prevBtn.click();
          if (e.key === 'ArrowRight') nextBtn.click();
        });

        controls.appendChild(prevBtn);
        controls.appendChild(counter);
        controls.appendChild(nextBtn);
        if (pdfBtn) controls.appendChild(pdfBtn);
        document.body.appendChild(controls);

        if (caption) caption.style.display = 'none';

        window.__pager = {
          goToIndex: function (i) {
            if (i < 0 || i >= pages.length) return false;
            current = i; show(i); return true;
          },
          step: function (d) {
            var n = current + d;
            if (n < 0 || n >= pages.length) return;
            current = n; show(n);
          },
          currentImg: function () { return pages[current].querySelector('img'); }
        };

        show(current);
      });
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ZOOM = 2.2;

      document.querySelectorAll('.reader .page').forEach((page) => {
        const img = page.querySelector('img');
        if (!img) return;

        const hint = document.createElement('div');
        hint.className = 'zoom-hint';
        hint.textContent = '🔍 Cliquer pour zoomer';
        page.appendChild(hint);

        let panX = 0, panY = 0;
        let isDown = false;
        let dragged = false;
        let startX, startY, startPanX, startPanY;

        function isZoomed() { return page.classList.contains('zoomed'); }

        function updateHint() {
          hint.textContent = isZoomed()
            ? '✋ Glisser pour déplacer · cliquer pour dézoomer'
            : '🔍 Cliquer pour zoomer';
        }

        function applyTransform() {
          img.style.transform = isZoomed()
            ? `translate(${panX}px, ${panY}px) scale(${ZOOM})`
            : '';
        }

        function clampPan() {
          const pageRect = page.getBoundingClientRect();
          const scaledW = img.offsetWidth * ZOOM;
          const scaledH = img.offsetHeight * ZOOM;
          const maxX = Math.max(0, (scaledW - pageRect.width) / 2);
          const maxY = Math.max(0, (scaledH - pageRect.height) / 2);
          panX = Math.min(maxX, Math.max(-maxX, panX));
          panY = Math.min(maxY, Math.max(-maxY, panY));
        }

        img.addEventListener('click', () => {
          if (dragged) { dragged = false; return; }
          page.classList.toggle('zoomed');
          panX = 0;
          panY = 0;
          applyTransform();
          updateHint();
        });

        page.addEventListener('mousedown', (e) => {
          if (!isZoomed()) return;
          isDown = true;
          dragged = false;
          page.classList.add('dragging');
          startX = e.pageX;
          startY = e.pageY;
          startPanX = panX;
          startPanY = panY;
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const dx = e.pageX - startX;
          const dy = e.pageY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
          panX = startPanX + dx;
          panY = startPanY + dy;
          clampPan();
          applyTransform();
        });

        document.addEventListener('mouseup', () => {
          isDown = false;
          page.classList.remove('dragging');
        });

        // Déplacement au doigt dans l'image zoomée
        page.addEventListener('touchstart', (e) => {
          dragged = false;
          if (!isZoomed() || e.touches.length !== 1) return;
          isDown = true;
          startX = e.touches[0].pageX;
          startY = e.touches[0].pageY;
          startPanX = panX;
          startPanY = panY;
        }, { passive: true });
        page.addEventListener('touchmove', (e) => {
          if (!isDown || !isZoomed() || e.touches.length !== 1) return;
          e.preventDefault();
          const dx = e.touches[0].pageX - startX;
          const dy = e.touches[0].pageY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
          panX = startPanX + dx;
          panY = startPanY + dy;
          clampPan();
          applyTransform();
        }, { passive: false });
        page.addEventListener('touchend', () => { isDown = false; });
      });
    });
  </script>

  <script>
    async function downloadPDF() {
      const btn = document.getElementById('pdf-btn');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Préparation...';
      try {
        const { jsPDF } = window.jspdf;
        const images = Array.from(document.querySelectorAll('.hero img, .page img'));
        let doc;
        for (let i = 0; i < images.length; i++) {
          const img = images[i];
          if (!img.complete) {
            await new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
          }
          if (!img.naturalWidth || !img.naturalHeight) {
            console.warn('Image ignorée (introuvable) :', img.src);
            continue;
          }
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
          const wmm = canvas.width * 0.264583;
          const hmm = canvas.height * 0.264583;
          const orientation = wmm > hmm ? 'landscape' : 'portrait';
          if (!doc) {
            doc = new jsPDF({ orientation, unit: 'mm', format: [wmm, hmm] });
          } else {
            doc.addPage([wmm, hmm], orientation);
          }
          doc.addImage(dataUrl, 'JPEG', 0, 0, wmm, hmm);
        }
        if (!doc) {
          throw new Error('Aucune image valide trouvée.');
        }
        doc.save('code - solo.pdf');
      } catch (err) {
        alert("Le PDF n'a pas pu être généré. Réessaie, ou vérifie que toutes les planches sont bien chargées.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }
  </script>

  <div id="chat-modal" role="dialog" aria-modal="true" aria-label="Chat public">
    <div class="chat-box">

        <h3>💬 Discussion</h3>

      </div>
      <p class="chat-note">Chat public hébergé par Cbox : aucun compte requis, seul un nom ou pseudo suffit. Les messages sont visibles de tous, ne communiquez aucune information personnelle. Connexion Internet requise.</p>
      <div id="chat-container"></div>
    </div>
  </div>

  <script>
    (function () {
      var CHAT_URL = 'https://www5.cbox.ws/box/?boxid=967777&boxtag=Yceynw';
      var modal = document.getElementById('chat-modal');
      var loaded = false;
      function ouvrir() {
        modal.classList.add('visible');
        if (loaded) return;
        if (!navigator.onLine) {
          document.getElementById('chat-container').textContent = '📡 Le chat nécessite une connexion Internet.';
          return;
        }
        loaded = true;
        var f = document.createElement('iframe');
        f.src = CHAT_URL;
        f.setAttribute('allowtransparency', 'yes');
        f.setAttribute('allow', 'autoplay');
        f.setAttribute('frameborder', '0');
        f.setAttribute('scrolling', 'auto');
        f.setAttribute('title', 'Chat Cbox');
        document.getElementById('chat-container').appendChild(f);
      }
      function fermer() { modal.classList.remove('visible'); }
      document.getElementById('chat-btn').addEventListener('click', ouvrir);
      document.getElementById('chat-close').addEventListener('click', fermer);
      modal.addEventListener('click', function (e) { if (e.target === modal) fermer(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fermer(); });
    })();
  </script>

    #film-btn:hover, #film-btn:focus-visible, #film-btn[aria-pressed="true"] { background: var(--accent-deep); color: var(--cream); }
    #film {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      background: rgba(30,26,22,0.92); backdrop-filter: blur(6px);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); color: #f2ead9; font-family: 'Karla', sans-serif;
    }
    body.film-open #film { display: block; }
    #film-track {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 2px;
      scrollbar-width: thin; scroll-snap-type: x proximity;
    }
    .thumb {
      position: relative; flex: 0 0 auto; width: 64px; height: 84px; padding: 0;
      border: 2px solid transparent; border-radius: 4px; background: #000;
      cursor: pointer; overflow: hidden; scroll-snap-align: center;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.75; }
    .thumb b {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 0;
      background: rgba(0,0,0,0.7); color: #f2ead9; font: 600 0.7rem 'Karla', sans-serif; text-align: center;
    }
    .thumb:hover img { opacity: 1; }
    .thumb.active { border-color: #9fc9a3; }
    .thumb.active img { opacity: 1; }
    body.film-open .pager-controls { bottom: calc(var(--film-h, 110px) + 14px); }
    body.film-open .page img { max-height: calc(100vh - 90px - var(--film-h, 110px)); max-height: calc(100dvh - 90px - var(--film-h, 110px)); }
  </style>

  <div id="film" aria-label="Miniatures des planches">
    <div id="film-track" role="listbox"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.createElement('button');
      btn.id = 'film-btn'; btn.type = 'button';
      btn.title = 'Afficher ou masquer la bande de miniatures';
      var actions = document.querySelector('.topbar__actions');
      actions.insertBefore(btn, document.getElementById('chat-btn'));

      // Lien direct vers une planche : navigation verrouillée, pas de bande
      if (!window.__pager) { btn.style.display = 'none'; return; }

      var pages = Array.prototype.slice.call(document.querySelectorAll('.reader .page'));
      var track = document.getElementById('film-track');
      var film = document.getElementById('film');
      var thumbs = [], built = false, activeIdx = 0;

      function setFilmH() { document.documentElement.style.setProperty('--film-h', film.offsetHeight + 'px'); }
      window.addEventListener('resize', function () { if (document.body.classList.contains('film-open')) setFilmH(); });
      window.addEventListener('load', function () { if (document.body.classList.contains('film-open')) setFilmH(); });

      function build() {
        built = true;
        pages.forEach(function (p, i) {
          var m = String(p.id).match(/\d+/);
          var label = /couverture/i.test(p.querySelector('img').getAttribute('src') + p.id) ? 'Couv.' : (m ? parseInt(m[0], 10) : (i + 1));
          var t = document.createElement('button');
          t.type = 'button'; t.className = 'thumb'; t.setAttribute('role', 'option');
          t.setAttribute('aria-label', 'Planche ' + label + ' (' + (i + 1) + ' sur ' + pages.length + ')');
          t.innerHTML = '<img loading="lazy" decoding="async" alt=""><b>' + label + '</b>';
          t.firstChild.src = p.querySelector('img').getAttribute('src');
          t.addEventListener('click', function () { window.__pager.goToIndex(i); });
          track.appendChild(t); thumbs.push(t);
        });
      }
      function mark(i) {
        activeIdx = i;
        if (!built) return;
        thumbs.forEach(function (t, k) { t.classList.toggle('active', k === i); });
        if (thumbs[i] && document.body.classList.contains('film-open')) {
          thumbs[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        }
      }
      var previous = window.__onShow;
      window.__onShow = function (i) { mark(i); if (previous) previous(i); };

      function setOpen(open) {
        document.body.classList.toggle('film-open', open);
        btn.setAttribute('aria-pressed', open ? 'true' : 'false');
        btn.innerHTML = '🎞️<span class="lbl"> ' + (open ? 'Bande visible' : 'Bande masquée') + '</span>';
        btn.setAttribute('aria-label', open ? 'Bande de miniatures visible, cliquer pour la masquer' : 'Bande de miniatures masquée, cliquer pour l’afficher');
        if (open) {
          if (!built) build();
          setFilmH();
          mark(activeIdx);
          if (thumbs[activeIdx]) thumbs[activeIdx].scrollIntoView({ block: 'nearest', inline: 'center' });
        }
      }
      btn.addEventListener('click', function () { setOpen(!document.body.classList.contains('film-open')); });
      setOpen(true); // visible par défaut
    });
  </script>

  <!-- ===== Adaptation smartphone ===== -->
  <style>
    .page { touch-action: manipulation; }
    .page.zoomed { touch-action: none; }
    @media (max-width: 520px) {
      .topbar { padding: 10px 12px; }
      .topbar__actions { gap: 8px; }
      #chat-btn, #film-btn { padding: 6px 11px; font-size: 0.85rem; }
      .topbar__home { font-size: 0.75rem; }
      body .pager-controls {
        flex-wrap: wrap; justify-content: center; gap: 6px 10px;
        width: max-content; max-width: calc(100vw - 16px);
        padding: 6px 12px; border-radius: 22px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }
      body .pager-controls .pdf-btn { font-size: 0.7rem; padding: 5px 10px; margin: 0; }
      .thumb { width: 52px; height: 68px; }
      #film-info { display: none; }
      #film .film-tools { padding-bottom: 6px; }
    }
    @media (max-width: 480px) {
      .lbl { display: none; }
    }
  </style>

  <script>
    // Balayage gauche/droite sur la planche pour tourner les pages (planche non zoomée)
    (function () {
      var x0, y0, t0, ok = false;
      document.addEventListener('touchstart', function (e) {
        ok = false;
        if (!window.__pager || e.touches.length !== 1) return;
        var page = e.target.closest && e.target.closest('.reader .page');
        if (!page || page.classList.contains('zoomed')) return;
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); ok = true;
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (!ok) return;
        ok = false;
        var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
        if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.6 || Date.now() - t0 > 700) return;
        window.__pager.step(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();
  </script>
  <div class="video-modal" id="video-modal" role="dialog" aria-modal="true" aria-label="Vidéo : Le code perdu">
    <div class="video-modal__box">
      <button type="button" class="video-modal__close" id="video-close" aria-label="Fermer la vidéo">✕</button>
      <video id="video-player" controls playsinline preload="none">
        <source src="../code/video/Le%20code%20perdu.mp4" type="video/mp4">
        <source src="https://raw.githubusercontent.com/parisistiti-cell/mes-bd/main/code/video/Le%20code%20perdu.mp4" type="video/mp4">
        Votre navigateur ne peut pas lire cette vidéo.
      </video>
      <div class="video-modal__actions">
        <button type="button" id="video-save">⬇ Enregistrer la vidéo</button>
        <button type="button" id="video-replay" class="is-replay">↻ Revoir</button>
        <button type="button" id="video-close2">✕ Fermer</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const controls = document.querySelector('.pager-controls');
      const pdf = document.getElementById('pdf-btn');
      if (!controls) return;
      const vbtn = document.createElement('button');
      vbtn.type = 'button';
      vbtn.id = 'video-btn';
      vbtn.className = 'pdf-btn';
      vbtn.textContent = '▶ Voir la vidéo';
      vbtn.setAttribute('aria-label', 'Voir la vidéo : Le code perdu');
      controls.insertBefore(vbtn, pdf && pdf.parentNode === controls ? pdf : null);
      const btns = [vbtn];

      // Visible uniquement sur la couverture et les planches 1 à 7 (index 0 à 7)
      const LAST_INDEX = 7;
      const prevOnShow = window.__onShow;
      window.__onShow = function (i) {
        vbtn.style.display = i <= LAST_INDEX ? '' : 'none';
        if (prevOnShow) prevOnShow(i);
      };
      vbtn.style.display = '';
      const modal = document.getElementById('video-modal');
      const player = document.getElementById('video-player');
      const closeBtn = document.getElementById('video-close');
      const closeBtn2 = document.getElementById('video-close2');
      const saveBtn = document.getElementById('video-save');
      const replayBtn = document.getElementById('video-replay');
      if (!btns.length || !modal || !player) return;

      const FILE_NAME = 'Le code perdu.mp4';

      function openVideo(e) {
        e.stopPropagation();
        modal.classList.remove('ended');
        modal.classList.add('open');
        player.play().catch(() => {});
      }
      function closeVideo() {
        modal.classList.remove('open', 'ended');
        player.pause();
      }
      function replayVideo() {
        modal.classList.remove('ended');
        player.currentTime = 0;
        player.play().catch(() => {});
      }
      async function saveVideo() {
        const src = player.currentSrc || (player.querySelector('source') || {}).src;
        if (!src) return;
        const label = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = 'Téléchargement…';
        try {
          const res = await fetch(src);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = FILE_NAME;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        } catch (err) {
          window.open(src, '_blank', 'noopener');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = label;
        }
      }

      btns.forEach((b) => b.addEventListener('click', openVideo));
      closeBtn.addEventListener('click', closeVideo);
      closeBtn2.addEventListener('click', closeVideo);
      replayBtn.addEventListener('click', replayVideo);
      saveBtn.addEventListener('click', saveVideo);
      player.addEventListener('ended', () => modal.classList.add('ended'));
      player.addEventListener('play', () => modal.classList.remove('ended'));
      modal.addEventListener('click', (e) => { if (e.target === modal) closeVideo(); });
      document.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') closeVideo();
        e.stopPropagation();
      }, true);
    });
  </script>
