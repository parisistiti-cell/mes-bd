<style>
  :root {
    --cream: #f2ead9;
    --cream-deep: #e8dcc3;
    --ink: #3a2e28;
    --ink-soft: #6b5c50;
    --terracotta: #b9645f;
    --terracotta-deep: #9c4a47;
    --rule: rgba(58, 46, 40, 0.15);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(242, 234, 217, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--terracotta-deep);

  .topbar__progress {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .hero {
    position: relative;
    max-width: 720px;
    margin: 0 auto;

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }
  .hero__caption {
    max-width: 560px;
    margin: 40px auto 60px;
    padding: 0 28px;
    text-align: center;
  }
  .hero__caption h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 2.6rem);
    letter-spacing: 0.01em;
    margin: 0 0 12px;
    color: var(--terracotta-deep);
  }
  .pdf-btn {
    font-family: 'Karla', sans-serif;
    font-size: 0.85rem;
    color: var(--terracotta-deep);
    background: transparent;
    border: 1px solid var(--terracotta-deep);
    border-radius: 20px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pdf-btn:hover:not(:disabled) {
    background: var(--terracotta-deep);
    color: var(--cream);
  }
  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .reader {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 100px;
  }
  .page {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 0 auto;
    scroll-margin-top: 64px;
    position: relative;

  .zoom-hint {
    position: absolute;
    bottom: 14px;
    right: 14px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(30, 26, 22, 0.78);
    color: #f2ead9;

    font-size: 0.78rem;
    padding: 6px 12px;

    pointer-events: none;
    z-index: 5;

  @media (hover: hover) and (pointer: fine) {
    .page:hover .zoom-hint {

    }

  .page img {
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: calc(100vh - 90px);
    max-height: calc(100dvh - 90px);
    margin: 0 auto;
    object-fit: contain;
    cursor: zoom-in;
    transition: transform 0.25s ease;

  .page.zoomed {

  <script>
    const progressEl = document.getElementById('progress');
    function updateProgress() {
      if (!progressEl) return;
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? Math.round((scrollTop / docHeight) * 100) : 0;
      progressEl.textContent = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();
  </script>

  <script>
    function __isolatePage(target) {
      if (!target) return;
      const el = document.querySelector(target);
      if (!el) return;
     
document.querySelectorAll('.page').forEach((p) => {
  p.style.display = (p === el) ? '' : 'none';
});
      const hero = document.querySelector('.hero');
      const caption = document.querySelector('.hero__caption');
      const foot = document.querySelector('footer');
      if (hero) hero.style.display = 'none';
      if (caption) caption.style.display = 'none';
      if (foot) foot.style.display = 'none';
      const pager = document.querySelector('.pager-controls');
      if (pager) pager.remove();
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      el.scrollIntoView();
    }
    window.__isolatePage = __isolatePage;

    if (window.location.hash) {
      // Lien partagé vers une planche précise : reste verrouillé dessus,
      // sans navigation possible.
      document.addEventListener('DOMContentLoaded', () => __isolatePage(window.location.hash));
    } else {
      // Lecture normale : une planche à la fois, avec précédent/suivant.
      // La couverture, le titre et le pied de page sont masqués pendant
      // la lecture ; le bouton PDF est déplacé dans la barre du bas.
      document.addEventListener('DOMContentLoaded', () => {
        const pages = Array.from(document.querySelectorAll('.reader .page'));
        if (pages.length === 0) return;

        let current = 0;

        const hero = document.querySelector('.hero');
        const caption = document.querySelector('.hero__caption');
        const foot = document.querySelector('footer');
        const pdfBtn = document.getElementById('pdf-btn');

        if (hero) hero.style.display = 'none';
        if (foot) foot.style.display = 'none';
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const style = document.createElement('style');
        style.textContent = `
          .pager-controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 14px; align-items: center; z-index: 30;
            background: rgba(30,26,22,0.82); backdrop-filter: blur(6px);
            padding: 8px 18px; border-radius: 30px; color: #f2ead9;
            font-family: -apple-system, sans-serif; font-size: 0.85rem;
          }
          .pager-btn {
            background: none; border: none; color: #f2ead9; font-size: 1.3rem;
            cursor: pointer; padding: 2px 10px; line-height: 1;
          }
          .pager-btn:disabled { opacity: 0.3; cursor: default; }
          .reader { padding-bottom: 0 !important; }
        `;
        document.head.appendChild(style);

        const controls = document.createElement('div');
        controls.className = 'pager-controls';

        const prevBtn = document.createElement('button');
        prevBtn.className = 'pager-btn';
        prevBtn.textContent = '‹';
        prevBtn.setAttribute('aria-label', 'Planche précédente');

        const counter = document.createElement('span');

        const nextBtn = document.createElement('button');
        nextBtn.className = 'pager-btn';
        nextBtn.textContent = '›';
        nextBtn.setAttribute('aria-label', 'Planche suivante');

        function show(i) {
          pages.forEach((p, idx) => {
            p.style.display = idx === i ? 'flex' : 'none';
            p.classList.remove('zoomed');
            const im = p.querySelector('img');
            if (im) im.style.transform = '';
            const hint = p.querySelector('.zoom-hint');
            if (hint) hint.textContent = '🔍 Cliquer pour zoomer';
          });
          prevBtn.disabled = i === 0;
          nextBtn.disabled = i === pages.length - 1;
          counter.textContent = (i + 1) + ' / ' + pages.length;
          if (window.__onShow) window.__onShow(i);
        }

        prevBtn.addEventListener('click', () => { if (current > 0) { current--; show(current); } });
        nextBtn.addEventListener('click', () => { if (current < pages.length - 1) { current++; show(current); } });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') prevBtn.click();
          if (e.key === 'ArrowRight') nextBtn.click();
        });

        controls.appendChild(prevBtn);
        controls.appendChild(counter);
        controls.appendChild(nextBtn);
        if (pdfBtn) controls.appendChild(pdfBtn);
        document.body.appendChild(controls);

        if (caption) caption.style.display = 'none';

        window.__pager = {
          goToIndex: function (i) {
            if (i < 0 || i >= pages.length) return false;
            current = i; show(i); return true;
          },
          step: function (d) {
            var n = current + d;
            if (n < 0 || n >= pages.length) return;
            current = n; show(n);
          },
          currentImg: function () { return pages[current].querySelector('img'); }
        };

        show(current);
      });
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ZOOM = 2.2;

      document.querySelectorAll('.reader .page').forEach((page) => {
        const img = page.querySelector('img');
        if (!img) return;

        const hint = document.createElement('div');
        hint.className = 'zoom-hint';
        hint.textContent = '🔍 Cliquer pour zoomer';
        page.appendChild(hint);

        let panX = 0, panY = 0;
        let isDown = false;
        let dragged = false;
        let startX, startY, startPanX, startPanY;

        function isZoomed() { return page.classList.contains('zoomed'); }

        function updateHint() {
          hint.textContent = isZoomed()
            ? '✋ Glisser pour déplacer · cliquer pour dézoomer'
            : '🔍 Cliquer pour zoomer';
        }

        function applyTransform() {
          img.style.transform = isZoomed()
            ? `translate(${panX}px, ${panY}px) scale(${ZOOM})`
            : '';
        }

        function clampPan() {
          const pageRect = page.getBoundingClientRect();
          const scaledW = img.offsetWidth * ZOOM;
          const scaledH = img.offsetHeight * ZOOM;
          const maxX = Math.max(0, (scaledW - pageRect.width) / 2);
          const maxY = Math.max(0, (scaledH - pageRect.height) / 2);
          panX = Math.min(maxX, Math.max(-maxX, panX));
          panY = Math.min(maxY, Math.max(-maxY, panY));
        }

        img.addEventListener('click', () => {
          if (dragged) { dragged = false; return; }
          page.classList.toggle('zoomed');
          panX = 0;
          panY = 0;
          applyTransform();
          updateHint();
        });

        page.addEventListener('mousedown', (e) => {
          if (!isZoomed()) return;
          isDown = true;
          dragged = false;
          page.classList.add('dragging');
          startX = e.pageX;
          startY = e.pageY;
          startPanX = panX;
          startPanY = panY;
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const dx = e.pageX - startX;
          const dy = e.pageY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
          panX = startPanX + dx;
          panY = startPanY + dy;
          clampPan();
          applyTransform();
        });

        document.addEventListener('mouseup', () => {
          isDown = false;
          page.classList.remove('dragging');
        });

        // Déplacement au doigt dans l'image zoomée
        page.addEventListener('touchstart', (e) => {
          dragged = false;
          if (!isZoomed() || e.touches.length !== 1) return;
          isDown = true;
          startX = e.touches[0].pageX;
          startY = e.touches[0].pageY;
          startPanX = panX;
          startPanY = panY;
        }, { passive: true });
        page.addEventListener('touchmove', (e) => {
          if (!isDown || !isZoomed() || e.touches.length !== 1) return;
          e.preventDefault();
          const dx = e.touches[0].pageX - startX;
          const dy = e.touches[0].pageY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
          panX = startPanX + dx;
          panY = startPanY + dy;
          clampPan();
          applyTransform();
        }, { passive: false });
        page.addEventListener('touchend', () => { isDown = false; });
      });
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    async function downloadPDF() {
      const btn = document.getElementById('pdf-btn');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Préparation du PDF...';

      try {
        const { jsPDF } = window.jspdf;
        const images = Array.from(document.querySelectorAll('.reader .page img'));
        images.forEach((im) => { im.loading = 'eager'; }); // sinon les planches masquées (lazy) ne se chargent jamais
        let doc;

        for (let i = 0; i < images.length; i++) {
          const img = images[i];

          // IMPORTANT : on n'attend onload/onerror QUE si l'image n'a pas
          // encore fini de charger. Une image déjà "complete" (même en échec)
          // ne redéclenchera jamais ces événements -- attendre dessus
          // bloquerait tout l'export indéfiniment.
          if (!img.complete) {
            await new Promise((resolve) => {
              img.onload = resolve;
              img.onerror = resolve;
            });
          }

          if (!img.naturalWidth || !img.naturalHeight) {
            console.warn('Image ignorée (introuvable) :', img.src);
            continue;
          }

          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

          const wmm = canvas.width * 0.264583;
          const hmm = canvas.height * 0.264583;
          const orientation = wmm > hmm ? 'landscape' : 'portrait';

          if (!doc) {
            doc = new jsPDF({ orientation, unit: 'mm', format: [wmm, hmm] });
          } else {
            doc.addPage([wmm, hmm], orientation);
          }
          doc.addImage(dataUrl, 'JPEG', 0, 0, wmm, hmm);
        }

        if (doc) {
          doc.save('tp.pdf');
        } else {
          throw new Error("Aucune image valide trouvée pour générer le PDF.");
        }
      } catch (err) {
        alert("Le PDF n'a pas pu être généré. Réessaie, ou vérifie que toutes les planches sont bien chargées.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }
  </script>

  <div id="film" aria-label="Miniatures des planches">

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.createElement('button');
      btn.id = 'film-btn'; btn.type = 'button';
      btn.title = 'Afficher ou masquer la bande de miniatures';
      var actions = document.querySelector('.topbar__actions');
      actions.insertBefore(btn, document.getElementById('chat-btn'));

      // Lien direct vers une planche : navigation verrouillée, pas de bande
      if (!window.__pager) { btn.style.display = 'none'; return; }

      var pages = Array.prototype.slice.call(document.querySelectorAll('.reader .page'));
      var track = document.getElementById('film-track');
      var film = document.getElementById('film');
      var thumbs = [], built = false, activeIdx = 0;

      function setFilmH() { document.documentElement.style.setProperty('--film-h', film.offsetHeight + 'px'); }
      window.addEventListener('resize', function () { if (document.body.classList.contains('film-open')) setFilmH(); });
      window.addEventListener('load', function () { if (document.body.classList.contains('film-open')) setFilmH(); });

      function build() {
        built = true;
        pages.forEach(function (p, i) {
          var m = String(p.id).match(/\d+/);
          var label = /couverture/i.test(p.querySelector('img').getAttribute('src') + p.id) ? 'Couv.' : (m ? parseInt(m[0], 10) : (i + 1));
          var t = document.createElement('button');
          t.type = 'button'; t.className = 'thumb'; t.setAttribute('role', 'option');
          t.setAttribute('aria-label', 'Planche ' + label + ' (' + (i + 1) + ' sur ' + pages.length + ')');
          t.innerHTML = '<img loading="lazy" decoding="async" alt=""><b>' + label + '</b>';
          var ti = t.firstChild, full = p.querySelector('img').getAttribute('src');
          ti.onerror = function () { ti.onerror = null; ti.src = full; }; // repli si la miniature n'existe pas
          ti.src = full.replace(/(^|\/)images\//, '$1images/thumbs/');
          t.addEventListener('click', function () { window.__pager.goToIndex(i); });
          track.appendChild(t); thumbs.push(t);
        });
      }
      function mark(i) {
        activeIdx = i;
        if (!built) return;
        thumbs.forEach(function (t, k) { t.classList.toggle('active', k === i); });
        if (thumbs[i] && document.body.classList.contains('film-open')) {
          thumbs[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        }
      }
      var previous = window.__onShow;
      window.__onShow = function (i) { mark(i); if (previous) previous(i); };

      function setOpen(open) {
        document.body.classList.toggle('film-open', open);
        btn.setAttribute('aria-pressed', open ? 'true' : 'false');
        btn.innerHTML = '🎞️<span class="lbl"> ' + (open ? 'Bande visible' : 'Bande masquée') + '</span>';
        btn.setAttribute('aria-label', open ? 'Bande de miniatures visible, cliquer pour la masquer' : 'Bande de miniatures masquée, cliquer pour l’afficher');
        if (open) {
          if (!built) build();
          setFilmH();
          mark(activeIdx);
          if (thumbs[activeIdx]) thumbs[activeIdx].scrollIntoView({ block: 'nearest', inline: 'center' });
        }
      }
      btn.addEventListener('click', function () { setOpen(!document.body.classList.contains('film-open')); });
      setOpen(true); // visible par défaut
    });
  </script>

  <script>
    // Balayage gauche/droite sur la planche pour tourner les pages (planche non zoomée)
    (function () {
      var x0, y0, t0, ok = false;
      document.addEventListener('touchstart', function (e) {
        ok = false;
        if (!window.__pager || e.touches.length !== 1) return;
        var page = e.target.closest && e.target.closest('.reader .page');
        if (!page || page.classList.contains('zoomed')) return;
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); ok = true;
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (!ok) return;
        ok = false;
        var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
        if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.6 || Date.now() - t0 > 700) return;
        window.__pager.step(dx < 0 ? 1 : -1);
      }, { passive: true });
    })();
  </script>
  <script>
    // Précharge la planche suivante pendant la lecture de l'actuelle
    (function () {
      var prev = window.__onShow;
      window.__onShow = function (id) {
        if (prev) prev(id);
        var pages = document.querySelectorAll('.reader .page');
        for (var i = 0; i < pages.length; i++) {
          if ((typeof id === 'number' ? i === id : pages[i].id === id) && pages[i + 1]) {
            var im = pages[i + 1].querySelector('img');
            if (im) im.loading = 'eager';
          }
        }
      };
    })();
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('video-btn');
      const modal = document.getElementById('video-modal');
      const menu = document.getElementById('video-menu');
      const list = document.getElementById('video-list');
      const stage = document.getElementById('video-stage');
      const nameEl = document.getElementById('video-name');
      const player = document.getElementById('video-player');
      const closeBtn = document.getElementById('video-close');
      const closeBtn2 = document.getElementById('video-close2');
      const saveBtn = document.getElementById('video-save');
      const replayBtn = document.getElementById('video-replay');
      const othersBtn = document.getElementById('video-others');
      if (!btn || !modal || !player) return;

      const RAW = 'https://raw.githubusercontent.com/parisistiti-cell/mes-bd/main/';
      const VIDEOS = [
        { label: 'Mob',                          file: 'mob.mp4',                         dir: 'tp/videos/' },
        { label: 'Pilotage Porsche 991 GT3 RS',  file: 'pilotage porsche 991 gt3 rs.mp4', dir: 'tp/videos/' }
      ];
      let current = null;

      function showMenu() {
        player.pause();
        modal.classList.remove('ended');
        stage.hidden = true;
        menu.hidden = false;
        modal.setAttribute('aria-label', 'Choisir une vidéo');
        const first = list.querySelector('button');
        if (first) first.focus();
      }

      function play(v) {
        current = v;
        const enc = encodeURIComponent(v.file);
        player.pause();
        player.innerHTML = '';
        [ '../' + v.dir + enc, RAW + v.dir + enc ].forEach(function (u) {
          const s = document.createElement('source');
          s.src = u; s.type = 'video/mp4';
          player.appendChild(s);
        });
        const last = player.lastElementChild;
        if (last) last.addEventListener('error', function () {
          nameEl.textContent = v.label + ' — vidéo introuvable pour le moment';
        });
        player.load();
        nameEl.textContent = v.label;
        modal.setAttribute('aria-label', 'Vidéo : ' + v.label);
        modal.classList.remove('ended');
        menu.hidden = true;
        stage.hidden = false;
        player.play().catch(function () {});
      }

      VIDEOS.forEach(function (v) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'video-menu__item';
        b.textContent = '▶ ' + v.label;
        b.addEventListener('click', function () { play(v); });
        list.appendChild(b);
      });

      // Boutons posés au centre des planches : lancent directement leur vidéo
      document.querySelectorAll('.video-btn').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          const v = VIDEOS.find(function (x) { return x.file === b.dataset.file; });
          if (!v) return;
          modal.classList.add('open');
          play(v);
        });
      });

      function openModal(e) {
        e.stopPropagation();
        modal.classList.add('open');
        showMenu();
      }
      function closeModal() {
        modal.classList.remove('open', 'ended');
        player.pause();
      }
      function replay() {
        modal.classList.remove('ended');
        player.currentTime = 0;
        player.play().catch(function () {});
      }
      async function save() {
        if (!current) return;
        const src = player.currentSrc || (player.querySelector('source') || {}).src;
        if (!src) return;
        const label = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = 'Téléchargement…';
        try {
          const res = await fetch(src);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = current.file;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        } catch (err) {
          window.open(src, '_blank', 'noopener');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = label;
        }
      }

      btn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      closeBtn2.addEventListener('click', closeModal);
      othersBtn.addEventListener('click', showMenu);
      replayBtn.addEventListener('click', replay);
      saveBtn.addEventListener('click', save);
      player.addEventListener('ended', function () { modal.classList.add('ended'); });
      player.addEventListener('play', function () { modal.classList.remove('ended'); });
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', function (e) {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') closeModal();
        e.stopPropagation();
      }, true);
    });
  </script>
