<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sola</title>
<meta name="description" content="sola.">
<link rel="preconnect" href="http://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f2ead9;
    --cream-deep: #e8dcc3;
    --ink: #3a2e28;
    --ink-soft: #6b5c50;
    --terracotta: #b9645f;
    --terracotta-deep: #9c4a47;
    --rule: rgba(58, 46, 40, 0.15);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(242, 234, 217, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule);
  }

  .topbar__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    color: var(--terracotta-deep);
    text-decoration: none;
  }

  .topbar__progress {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .hero {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero__caption {
    max-width: 560px;
    margin: 40px auto 60px;
    padding: 0 28px;
    text-align: center;
  }

</html>
