<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'affaire de la souris</title>
<meta name="description" content="L'affaire de la souris — les 40 ans d'une étrange habitude.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #3d7d94;
    --teal-deep: #2b5c6e;
    --cream: #f2e9d3;
    --wood: #c79a63;
    --rust: #c0503a;
    --rust-deep: #9c3d2c;
    --ink: #2a2521;
    --ink-soft: #5c534a;
    --rule: rgba(42, 37, 33, 0.15);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(242, 233, 211, 0.94);
    backdrop-filter: blur(6px);
    border-bottom: 2px solid var(--ink);
  }

  .topbar__title {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.01em;
    color: var(--rust-deep);
    text-decoration: none;
  }

  .topbar__home {
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-soft);
  }

  .topbar__progress {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .hero {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero__caption {
    max-width: 560px;
    margin: 36px auto 56px;
    padding: 0 28px;
    text-align: center;
  }

  .hero__caption h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(1.6rem, 5.5vw, 2.2rem);
    letter-spacing: 0.01em;
    margin: 0 0 14px;
    color: var(--rust-deep);
    line-height: 1.15;
  }

  .hero__caption p {
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 22px;
  }

  .pdf-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    color: var(--rust-deep);
    background: transparent;
    border: 2px solid var(--rust-deep);
    border-radius: 4px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .pdf-btn:hover:not(:disabled) {
    background: var(--rust-deep);
    color: var(--cream);
  }

  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .reader {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 100px;
  }

  .page {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin: 0 auto;
    scroll-margin-top: 64px;
    position: relative;
  }
  .zoom-hint {
    position: absolute;
    bottom: 14px;
    right: 14px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(30, 26, 22, 0.78);
    color: #f2ead9;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) {
    .page:hover .zoom-hint {
      display: flex;
    }
  }

  .page img {
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: calc(100vh - 90px);
    margin: 0 auto;
    object-fit: contain;
    cursor: zoom-in;
    transition: transform 0.25s ease;
  }
  .page.zoomed {
    overflow: hidden;
    cursor: grab;
  }
  .page.zoomed.dragging {
    cursor: grabbing;
  }
  .page.zoomed.dragging img {
    transition: none;
  }

  .placeholder {
    margin: 20px auto;
    padding: 48px 28px;
    max-width: 560px;
    text-align: center;
    border: 2px dashed var(--ink);
    border-radius: 4px;
    color: var(--ink-soft);
    background: rgba(61, 125, 148, 0.06);
  }

  .placeholder p {
    margin: 0 0 6px;
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .placeholder code {
    background: var(--wood);
    color: var(--ink);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.85rem;
  }

  footer {
    text-align: center;
    padding: 40px 24px 60px;
    color: var(--ink-soft);
    font-size: 0.8rem;
    border-top: 2px solid var(--ink);
  }

  footer a { color: var(--rust-deep); }

  .pager-controls .pdf-btn {
    color: var(--cream);
    border-color: var(--cream);
    font-size: 0.75rem;
    padding: 6px 14px;
  }
  .pager-controls .pdf-btn:hover:not(:disabled) {
    background: var(--cream);
    color: var(--ink);
  }
</style>
</head>
<body>

  <nav class="topbar">
    <a class="topbar__title" href="#top">L'affaire de la souris</a>
    <a class="topbar__home" href="../">Toutes les BD</a>
  </nav>

  <div id="top"></div>

  <header class="hero">
    <img src="images/00.jpg" alt="Couverture — L'affaire de la souris">
  </header>

  <div class="hero__caption">
    <h1>L'affaire de la souris</h1>
    <p>Les 40 ans d'une étrange habitude.</p>
    <button id="pdf-btn" class="pdf-btn" onclick="downloadPDF()">Télécharger en PDF</button>
  </div>

  <!--
    ===========================================================
    AJOUTE TES PLANCHES ICI

    Pour chaque planche : dépose l'image dans le dossier images/
    puis ajoute un bloc comme celui-ci (en gardant le même ordre
    que ton histoire) :

   
    ===========================================================
  -->
  <main class="reader">

     <div class="page" id="page-0">
      <img src="images/00-couverture.jpg" alt="Planche 0">
    </div>
    <div class="page" id="page-01">
      <img src="images/01.jpg" alt="Planche 1">
    </div>
    
  </main>

  <footer>
    L'affaire de la souris — mis à jour au fil des chapitres
  </footer>

  <script>
    function __isolatePage(target) {
      if (!target) return;
      const el = document.querySelector(target);
      if (!el) return;
      document.querySelectorAll('.page').forEach((p) => {
        p.style.display = (p === el) ? 'flex' : 'none';
      });
      const hero = document.querySelector('.hero');
      const caption = document.querySelector('.hero__caption');
      const foot = document.querySelector('footer');
      if (hero) hero.style.display = 'none';
      if (caption) caption.style.display = 'none';
      if (foot) foot.style.display = 'none';
      const pager = document.querySelector('.pager-controls');
      if (pager) pager.remove();
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflow = 'hidden';
      el.scrollIntoView();
    }
    window.__isolatePage = __isolatePage;

    if (window.location.hash) {
      // Lien partagé vers une planche précise : reste verrouillé dessus,
      // sans navigation possible.
      document.addEventListener('DOMContentLoaded', () => __isolatePage(window.location.hash));
    } else {
      // Lecture normale : une planche à la fois, avec précédent/suivant.
      // La couverture, le titre et le pied de page sont masqués pendant
      // la lecture ; le bouton PDF est déplacé dans la barre du bas.
      document.addEventListener('DOMContentLoaded', () => {
        const pages = Array.from(document.querySelectorAll('.reader .page'));
        if (pages.length === 0) return;

        let current = 0;

        const hero = document.querySelector('.hero');
        const caption = document.querySelector('.hero__caption');
        const foot = document.querySelector('footer');
        const pdfBtn = document.getElementById('pdf-btn');

        if (hero) hero.style.display = 'none';
        if (foot) foot.style.display = 'none';
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const style = document.createElement('style');
        style.textContent = `
          .pager-controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 14px; align-items: center; z-index: 30;
            background: rgba(30,26,22,0.82); backdrop-filter: blur(6px);
            padding: 8px 18px; border-radius: 30px; color: #f2ead9;
            font-family: -apple-system, sans-serif; font-size: 0.85rem;
          }
          .pager-btn {
            background: none; border: none; color: #f2ead9; font-size: 1.3rem;
            cursor: pointer; padding: 2px 10px; line-height: 1;
          }
          .pager-btn:disabled { opacity: 0.3; cursor: default; }
          .reader { padding-bottom: 0 !important; }
        `;
        document.head.appendChild(style);

        const controls = document.createElement('div');
        controls.className = 'pager-controls';

        const prevBtn = document.createElement('button');
        prevBtn.className = 'pager-btn';
        prevBtn.textContent = '‹';
        prevBtn.setAttribute('aria-label', 'Planche précédente');

        const counter = document.createElement('span');

        const nextBtn = document.createElement('button');
        nextBtn.className = 'pager-btn';
        nextBtn.textContent = '›';
        nextBtn.setAttribute('aria-label', 'Planche suivante');

        function show(i) {
          pages.forEach((p, idx) => {
            p.style.display = idx === i ? 'flex' : 'none';
            p.classList.remove('zoomed');
            const im = p.querySelector('img');
            if (im) im.style.transform = '';
            const hint = p.querySelector('.zoom-hint');
            if (hint) hint.textContent = '🔍 Cliquer pour zoomer';
          });
          prevBtn.disabled = i === 0;
          nextBtn.disabled = i === pages.length - 1;
          counter.textContent = (i + 1) + ' / ' + pages.length;
        }

        prevBtn.addEventListener('click', () => { if (current > 0) { current--; show(current); } });
        nextBtn.addEventListener('click', () => { if (current < pages.length - 1) { current++; show(current); } });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') prevBtn.click();
          if (e.key === 'ArrowRight') nextBtn.click();
        });

        controls.appendChild(prevBtn);
        controls.appendChild(counter);
        controls.appendChild(nextBtn);
        if (pdfBtn) controls.appendChild(pdfBtn);
        document.body.appendChild(controls);

        if (caption) caption.style.display = 'none';

        show(current);
      });
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ZOOM = 2.2;

      document.querySelectorAll('.reader .page').forEach((page) => {
        const img = page.querySelector('img');
        if (!img) return;

        const hint = document.createElement('div');
        hint.className = 'zoom-hint';
        hint.textContent = '🔍 Cliquer pour zoomer';
        page.appendChild(hint);

        let panX = 0, panY = 0;
        let isDown = false;
        let dragged = false;
        let startX, startY, startPanX, startPanY;

        function isZoomed() { return page.classList.contains('zoomed'); }

        function updateHint() {
          hint.textContent = isZoomed()
            ? '✋ Glisser pour déplacer · cliquer pour dézoomer'
            : '🔍 Cliquer pour zoomer';
        }

        function applyTransform() {
          img.style.transform = isZoomed()
            ? `translate(${panX}px, ${panY}px) scale(${ZOOM})`
            : '';
        }

        function clampPan() {
          const pageRect = page.getBoundingClientRect();
          const scaledW = img.offsetWidth * ZOOM;
          const scaledH = img.offsetHeight * ZOOM;
          const maxX = Math.max(0, (scaledW - pageRect.width) / 2);
          const maxY = Math.max(0, (scaledH - pageRect.height) / 2);
          panX = Math.min(maxX, Math.max(-maxX, panX));
          panY = Math.min(maxY, Math.max(-maxY, panY));
        }

        img.addEventListener('click', () => {
          if (dragged) { dragged = false; return; }
          page.classList.toggle('zoomed');
          panX = 0;
          panY = 0;
          applyTransform();
          updateHint();
        });

        page.addEventListener('mousedown', (e) => {
          if (!isZoomed()) return;
          isDown = true;
          dragged = false;
          page.classList.add('dragging');
          startX = e.pageX;
          startY = e.pageY;
          startPanX = panX;
          startPanY = panY;
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const dx = e.pageX - startX;
          const dy = e.pageY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
          panX = startPanX + dx;
          panY = startPanY + dy;
          clampPan();
          applyTransform();
        });

        document.addEventListener('mouseup', () => {
          isDown = false;
          page.classList.remove('dragging');
        });
      });
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // Génère un PDF à partir de la couverture et de toutes les planches
    // actuellement présentes sur la page, dans leur ordre d'affichage.
    async function downloadPDF() {
      const btn = document.getElementById('pdf-btn');
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Préparation du PDF...';

      try {
        const { jsPDF } = window.jspdf;
        const images = Array.from(document.querySelectorAll('.hero img, .page img'));
        let doc;

        for (let i = 0; i < images.length; i++) {
          const img = images[i];
          if (!img.complete) {
            await new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
          }
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

          const wmm = canvas.width * 0.264583;
          const hmm = canvas.height * 0.264583;
          const orientation = wmm > hmm ? 'landscape' : 'portrait';

          if (i === 0) {
            doc = new jsPDF({ orientation, unit: 'mm', format: [wmm, hmm] });
          } else {
            doc.addPage([wmm, hmm], orientation);
          }
          doc.addImage(dataUrl, 'JPEG', 0, 0, wmm, hmm);
        }

        doc.save("L'affaire de la souris.pdf");
      } catch (err) {
        alert("Le PDF n'a pas pu être généré. Réessaie, ou vérifie que toutes les planches sont bien chargées.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }
  </script>

</body>
</html>
